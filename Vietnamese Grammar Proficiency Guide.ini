Vietnamese Grammar Proficiency Guide
This document categorizes Vietnamese grammar patterns into three difficulty tiers: Easy (A1-A2), Intermediate (B1-B2), and Hard (C1-C2). Each entry includes the structural pattern, necessary keywords, and a concise explanation of the rule.
🟢 Level 1: Easy (A1 / A2)
Focus: Basic syntax, identification, simple descriptions, and survival communication.
1. The Copula "To Be" (Là)
Pattern: Subject + là + Noun/Adjective
Necessary Words: là (to be)
Explanation:
Used to define the subject or equate two things (A is B). Unlike English, là is often omitted before adjectives in simple descriptive sentences, but it is mandatory when connecting two nouns. It serves as the fundamental connector for identification and classification.1
2. Basic Negation (Không)
Pattern: Subject + không + Verb/Adjective
Necessary Words: không (no/not)
Explanation:
The word không is placed directly before a verb or adjective to negate it. This is the most neutral and common form of negation, used for denying facts, actions, or attributes. It is also used at the end of a sentence to form a Yes/No question.1
3. Basic Classifiers (Loại từ)
Pattern: Number + Classifier + Noun
Necessary Words: cái (inanimate objects), con (animals/living things), người (people)
Explanation:
Vietnamese requires a classifier between a number and a noun. While there are specific classifiers for shape and function, cái is the generic classifier for inanimate objects, and con is strictly for animals. Omitting the classifier when counting is a grammatical error.1
4. Possession and Existence (Có)
Pattern: Subject + có + Object (Possession) / Có + Noun (Existence)
Necessary Words: có (to have/there is)
Explanation:
Có functions similarly to the English "have" (ownership) and "there is/are" (existence). When used at the start of a sentence (or with a dummy subject), it asserts the existence of an object or phenomenon. It is also the positive answer to "Do you have...?" questions.1
5. Yes/No Questions (Có... không?)
Pattern: Subject + có + Verb/Adj + không?
Necessary Words: có (start of question frame), không (end of question frame)
Explanation:
To turn a statement into a Yes/No question, the verb or adjective is bracketed by có and không. The literal translation is "Does[Verb] or not?". The answer repeats the verb (for Yes) or uses không (for No).1
6. Basic Tense Markers (Đã, Đang, Sẽ)
Pattern: Subject + (Tense Marker) + Verb
Necessary Words: đã (past), đang (continuous/present), sẽ (future)
Explanation:
Vietnamese is not strictly a tense language; time is often indicated by context words (yesterday, tomorrow). However, these markers are used to explicitly anchor an action in time: đã for completed actions, đang for actions currently happening, and sẽ for future intent.1
7. The Prohibitive Imperative (Đừng)
Pattern: (Subject) + đừng + Verb
Necessary Words: đừng (don't)
Explanation:
Used to tell someone not to do something. It functions as a negative command. While không is a factual negation (I do not eat), đừng is an imperative negation (Do not eat!).1
🟡 Level 2: Intermediate (B1 / B2)
Focus: Complex relationships, modality, passivity, and resultative states.
8. Passive Voice (Bị / Được)
Pattern: Subject + bị/được + (Agent) + Verb
Necessary Words: bị (suffer/negative), được (benefit/positive)
Explanation:
Unlike English, the Vietnamese passive voice carries an emotional connotation. Được is used when the subject benefits from the action (e.g., getting promoted), while bị is used when the subject suffers from the action (e.g., getting hit or scolded). Using the wrong marker changes the speaker's attitude toward the event.1
9. Resultative Aspect (Xong)
Pattern: Verb + xong
Necessary Words: xong (finished/done)
Explanation:
Placed immediately after a verb, xong indicates that the action has been successfully completed and finished. It differs from the past tense marker đã because it emphasizes the conclusion of the activity, not just its occurrence in the past.1
10. Comparisons (Hơn / Nhất)
Pattern: A + Adjective + hơn + B (Comparative) / A + Adjective + nhất (Superlative)
Necessary Words: hơn (more/than), nhất (most/best)
Explanation:
Adjectives follow the noun, and comparison markers follow the adjective. Hơn functions as both "more" and "than" in comparisons (A is big than B). Nhất marks the absolute superlative (A is big most).1
11. Relative Clauses (Mà)
Pattern: Noun + mà + Clause
Necessary Words: mà (that/which/who)
Explanation:
The particle mà introduces a relative clause that modifies the preceding noun. While sometimes optional, it is structurally necessary when the relationship between the noun and the clause is complex, contrasting, or emphatic. It functions similarly to the English "that" or "which" in complex sentences.1
12. Conditional Sentences (Nếu... thì...)
Pattern: Nếu + Condition, thì + Result
Necessary Words: nếu (if), thì (then)
Explanation:
Standard conditional structure. Nếu introduces the hypothesis, and thì introduces the consequence. Thì acts as a connector and marker of the main clause; omitting it in spoken language is common, but it is required in formal grammar to separate the clauses clearly.1
13. Causative Verbs (Làm / Cho)
Pattern: Subject + làm/cho + Object + Verb/Adjective
Necessary Words: làm (make), cho (let/allow/give)
Explanation:
Used to express causing something to happen or allowing someone to do something. Làm implies causation or forcing a state (e.g., "The news made me sad"), while cho implies permission or enablement (e.g., "Mom let me go out").1
14. Parallel Increase (Càng... càng)
Pattern: Càng + Adj/Verb 1 + càng + Adj/Verb 2
Necessary Words: càng (the more)
Explanation:
Equivalent to the English "The more..., the more..." structure. It describes two variables changing in proportion to each other. For example: Càng đông càng vui (The more crowded, the happier/merrier).1
🔴 Level 3: Hard (C1 / C2)
Focus: Rhetoric, stylistics, emphasis, and abstract logic.
15. Reduplication (Từ láy)
Pattern: AAAA (Total) or AAB (Partial/Rhyming)
Necessary Words: Varies (e.g., xanh xanh, đo đỏ, sạch sành sanh)
Explanation:
A morphological process where a word root is repeated (often with tone or consonant changes) to soften, intensify, or alter the meaning. For example, đo đỏ (reddish) is softer than đỏ (red), while sạch sành sanh (completely clean/wiped out) is an intense emphatic form of sạch (clean). Mastery requires intuitive knowledge of sound euphony.1
16. Discourse Particles (Nhỉ, Nhé, Cơ, Mà)
Pattern: Sentence + Particle
Necessary Words: nhỉ (right? - self-reflection or agreement), nhé (okay? - softness/request), cơ (insistence), mà (explanation/counter-expectation)
Explanation:
These untranslatable particles are placed at the end of sentences to convey mood, attitude, or social nuance. Nhỉ invites agreement or expresses wonder; cơ adds a childish or insistent tone; mà implies the listener should have known the information (counter-expectation).1
17. Topic-Comment Structure (Thì)
Pattern: Topic + thì + Comment
Necessary Words: thì (as for/then)
Explanation:
A syntax inversion where the object or topic is moved to the front of the sentence for emphasis, followed by thì (as for), and then the comment. This structure is distinct from Subject-Verb-Object and is used to highlight specific information or contrast topics.1
18. Formal Explanatory Structure (Sở dĩ... là vì...)
Pattern: Sở dĩ + Result + là vì + Cause
Necessary Words: sở dĩ (the reason why), là vì (is because)
Explanation:
A highly formal structure used in academic or argumentative writing to explain causality. It reverses the standard "Because... therefore" structure, placing the result first (marked by sở dĩ) and the cause second (marked by là vì), adding weight and formality to the explanation.1
19. Rhetorical Questions (Sao lại...?)
Pattern: Sao + Subject + lại + Verb...?
Necessary Words: sao (why/how), lại (contrary to expectation)
Explanation:
Used to express surprise, reproach, or confusion rather than a genuine request for information. The word lại indicates that the action is occurring contrary to the speaker's expectation or logic (e.g., "Why on earth would you do that?").1
20. Double Negation for Emphasis (Chẳng... đâu)
Pattern: Chẳng + Verb + đâu
Necessary Words: chẳng (informal/emphatic not), đâu (particle of denial)
Explanation:
An emphatic negation used to strongly deny a statement or possibility. Chẳng is a stronger, more colloquial version of không, and the final particle đâu reinforces the negation, often implying "not at all" or "certainly not".1
