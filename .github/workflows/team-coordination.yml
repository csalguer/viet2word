# Team Coordination Workflow
# The Cartographer's automated expedition management

name: Team Coordination

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, ready_for_review, review_requested]
  schedule:
    # Weekly planning sync - Mondays at 9 AM UTC
    - cron: "0 9 * * 1"

jobs:
  # 🗺️ Auto-assign based on labels
  assign-by-expertise:
    name: Assign by Expertise
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'labeled'
    steps:
      - name: Assign TypeScript issues
        if: contains(github.event.label.name, 'typescript') || contains(github.event.label.name, 'types')
        uses: actions/github-script@v7
        with:
          script: |
            // The Typescripter handles type-related issues
            console.log('📐 TypeScript issue detected - routing to Typescripter domain');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['agent/typescripter']
            });

      - name: Assign Python issues
        if: contains(github.event.label.name, 'python') || contains(github.event.label.name, 'pydantic')
        uses: actions/github-script@v7
        with:
          script: |
            // The Pythonomancer handles Python issues
            console.log('🐍 Python issue detected - routing to Pythonomancer domain');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['agent/pythonomancer']
            });

      - name: Assign Epic issues
        if: contains(github.event.label.name, 'epic')
        uses: actions/github-script@v7
        with:
          script: |
            // The Cartographer coordinates epics
            console.log('🗺️ Epic detected - routing to Cartographer for coordination');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['agent/cartographer']
            });

  # 📊 PR Readiness Check
  pr-checklist:
    name: PR Readiness Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Add PR checklist
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const checklist = `
            ## 🗺️ Expedition Checklist (added by Cartographer)

            ### Before Merge
            - [ ] Types verified (Typescripter approved)
            - [ ] Python validation passed (if applicable)
            - [ ] Tests added/updated
            - [ ] Documentation updated
            - [ ] No breaking changes (or migration guide provided)

            ### Reviewers
            - [ ] Code review completed
            - [ ] QA validation (Barkeep approved)
            `;

            if (!body.includes('Expedition Checklist')) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: body + '\n\n' + checklist
              });
            }

  # 📅 Weekly Planning Summary
  weekly-summary:
    name: Weekly Planning Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Generate weekly summary
        uses: actions/github-script@v7
        with:
          script: |
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);

            // Get closed issues this week
            const closedIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              since: oneWeekAgo.toISOString(),
              per_page: 100
            });

            // Get open issues
            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            // Count by label
            const epicCount = openIssues.data.filter(i => 
              i.labels.some(l => l.name === 'epic')
            ).length;

            console.log(`📊 Weekly Summary:
            - Closed this week: ${closedIssues.data.length}
            - Open issues: ${openIssues.data.length}
            - Active epics: ${epicCount}
            `);
